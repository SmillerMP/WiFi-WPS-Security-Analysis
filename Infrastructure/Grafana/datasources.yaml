apiVersion: 1

datasources:
  - name: postgresql-datasource
    uid: wardriving-postgres
    type: postgres
    access: proxy
    isDefault: true
    url: postgres:5432
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      database: wardriving
      sslmode: disable
      postgresVersion: 9.3
      timescaledb: false
    editable: true